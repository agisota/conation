# Stalwart Mail Server — Conation self-host
# See https://stalw.art/docs/configuration
[server]
hostname = "%{env:STALWART_HOSTNAME}%"
# Bind all protocols
[server.listener.smtp]
bind = "[::]:25"
protocol = "smtp"

[server.listener.submission]
bind = "[::]:587"
protocol = "smtp"

[server.listener.imaps]
bind = "[::]:993"
protocol = "imap"
tls.implicit = true

[server.listener.jmap]
bind = "[::]:8080"
protocol = "http"

[server.listener.sieve]
bind = "[::]:4190"
protocol = "managesieve"

# TLS — auto via ACME for mail.* domain, fallback self-signed for local
[certificate.default]
cert = "%{file:/opt/stalwart-mail/certs/cert.pem}%"
private-key = "%{file:/opt/stalwart-mail/certs/privkey.pem}%"
default = true

# Storage — Postgres (same host as conationdb, separate DB `stalwart`)
[store.db]
type = "postgresql"
host = "postgres"
port = 5432
database = "stalwart"
user = "user"
password = "password"

[store.db.pool]
max-connections = 20

# Use DB store for all components
[storage]
data = "db"
fts = "db"
blob = "db"
lookup = "db"
directory = "db"

# Authentication — internal directory
[directory.internal]
type = "internal"
store = "db"

# SMTP queue
[queue]
# Retry etc defaults

[session.auth]
mechanisms = ["plain", "login"]
directory = "internal"

# JMAP
[jmap]
# Enable push
push.enabled = true

# IMAP
[imap]

# Admin HTTP API
[http]
# JMAP endpoint
[jmap.http]
url = "https://mail.%{env:STALWART_HOSTNAME}%"

[tracer.stdout]
type = "stdout"
level = "info"
ansi = false
