[package]
edition = "2024"
name = "contacts"
publish = false
version = "0.1.0"

[features]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "dep:conation_authorization",
  "dep:rate_limit",
  "dep:utoipa",
]
default = ["axum", "inbound", "outbound", "ports"]
inbound = ["axum", "dep:aws-sdk-sqs", "dep:sqs_worker", "ports"]
outbound = ["dep:aws-sdk-sqs", "dep:reqwest", "dep:sqlx", "ports"]
ports = []

[dependencies]
aws-sdk-sqs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
conation_authorization = { package = "macro_authorization", path = "../conation_authorization", default-features = false, features = [
  "axum",
], optional = true }
conation_user_id = { path = "../conation_user_id" }
rootcause = { workspace = true }
rate_limit = { path = "../rate_limit", features = ["axum"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
sqs_worker = { path = "../sqs_worker", optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
conation_db_migrator = { path = "../conation_db_migrator" }
http-body-util = { workspace = true }
rate_limit = { path = "../rate_limit", features = ["axum", "testing"] }
tower = { workspace = true }
