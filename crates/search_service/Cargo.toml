[package]
edition = "2024"
name = "search_service"
publish = false
version = "0.1.0"

[lib]
name = "search_service"
path = "src/lib.rs"

[[bin]]
name = "search_service_openapi"
path = "src/openapi.rs"

[dependencies]
agent_session = { path = "../agent_session", default-features = false }
rootcause = { workspace = true }
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
conation_aws_config = { path = "../conation_aws_config" }
axum = { workspace = true }
chrono = { workspace = true }
channels = { path = "../channels", default-features = false, features = ["outbound"] }
comms_db_client = { path = "../comms_db_client" }
crm = { path = "../crm", default-features = false, features = ["search"] }
document_sub_type = { path = "../document_sub_type" }
email_db_client = { path = "../email_db_client" }
entity_access = { path = "../entity_access", default-features = false, features = [
  "outbound",
] }
futures = { workspace = true }
http-body-util = { workspace = true }
indexmap = { workspace = true }
item_filters = { path = "../item_filters" }
conation_auth = { path = "../conation_auth" }
macro_authorization = { path = "../conation_authorization" }
conation_db_client = { path = "../conation_db_client" }
models_properties = { path = "../models_properties" }
models_soup = { path = "../models_soup" }
properties = { path = "../properties", default-features = false, features = [
  "outbound",
] }
system_properties = { path = "../system_properties" }
readonly_pool = { path = "../readonly_pool" }
conation_env = { path = "../conation_env" }
conation_env_var = { path = "../conation_env_var" }
macro_user_id = { package = "conation_user_id", path = "../conation_user_id" }
model = { path = "../model" }
models_email = { path = "../models_email" }
models_opensearch = { path = "../models_opensearch" }
models_search = { path = "../models_search" }
models_search_cursor = { path = "../models_search_cursor" }
name_search = { path = "../name_search" }
opensearch_client = { path = "../opensearch_client" }
secretsmanager_client = { path = "../secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
conation_auth = { path = "../conation_auth", features = ["testing"] }
