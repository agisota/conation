[package]
edition = "2024"
name = "conation_middleware"
publish = false
version = "0.1.0"

[features]
all = ["cloud_storage", "tracking"]
cloud_storage = [
  "dep:entity_access_db_utils",
  "dep:conation_user_id",
  "dep:model_user",
  "conation_db_client",
]
default = ["all"]
conation_db_client = ["dep:conation_db_client", "dep:sqlx"]
tracking = ["dep:ip_extractor"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"] }
axum-extra = { workspace = true }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
http-body-util = { workspace = true }
ip_extractor = { path = "../ip_extractor", optional = true }
conation_db_client = { path = "../conation_db_client", optional = true }
conation_env = { path = "../conation_env" }
conation_env_var = { path = "../conation_env_var" }
conation_user_id = { path = "../conation_user_id", optional = true }
conation_uuid = { path = "../conation_uuid" }
model = { path = "../model" }
model-entity = { path = "../model-entity" }
model_user = { path = "../model_user", optional = true }
models_permissions = { path = "../models_permissions" }
remote_env_var = { path = "../remote_env_var" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_urlencoded = { workspace = true }
urlencoding = { workspace = true }
