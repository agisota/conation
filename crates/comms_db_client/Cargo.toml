[package]
edition = "2024"
name = "comms_db_client"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
cached = { workspace = true }
channels = { path = "../channels", default-features = false, features = ["inbound", "outbound"] }
chrono = { workspace = true }
doppleganger = { workspace = true }
futures = { workspace = true }
conation_user_id = { path = "../conation_user_id" }
macro_uuid = { package = "conation_uuid", path = "../conation_uuid" }
model = { path = "../model" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
conation_db_migrator = { path = "../conation_db_migrator" }
