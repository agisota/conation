[package]
edition = "2024"
name = "collab_surface"
publish = false
version = "0.1.0"

[features]
default = []
inbound = [
  "dep:axum",
  "dep:conation_authorization",
  "dep:model-error-response",
  "dep:utoipa",
  "entity_access/inbound",
  "ports",
]
outbound = ["dep:lexical_client", "dep:sync_service_client", "ports"]
ports = ["dep:entity_access", "dep:tracing"]
postgres = ["dep:sqlx", "outbound"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
entity_access = { path = "../entity_access", optional = true, default-features = false, features = ["ports"] }
lexical_client = { path = "../lexical_client", optional = true }
conation_authorization = { path = "../conation_authorization", optional = true, default-features = false, features = ["axum"] }
conation_sync_service_jwt = { path = "../conation_sync_service_jwt" }
conation_user_id = { path = "../conation_user_id" }
conation_uuid = { path = "../conation_uuid" }
model = { path = "../model" }
model-entity = { path = "../model-entity" }
model-error-response = { path = "../model-error-response", optional = true }
models_permissions = { path = "../models_permissions" }
rootcause = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
sync_service_client = { path = "../sync_service_client", optional = true }
thiserror = { workspace = true }
tokio-retry = { workspace = true }
tracing = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
conation_db_migrator = { path = "../conation_db_migrator" }
mockall = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
