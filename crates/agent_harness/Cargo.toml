[package]
edition = "2024"
name = "agent_harness"
publish = false
version = "0.1.0"

[dependencies]
agent-client-protocol = { workspace = true }
# The session-token claim shape and its signing, so the harness and the proxy
# cannot disagree about what a token says.
agent_egress = { path = "../agent_egress" }
agent_fold = { path = "../agent_fold" }
agent_runtime_protocol = { path = "../agent_runtime_protocol" }
agent_session = { path = "../agent_session" }
agent_trigger = { path = "../agent_trigger" }
cursor_api_key = { path = "../cursor_api_key" }
cursor_cloud_agents = { path = "../cursor_cloud_agents" }
entity_access = { path = "../entity_access" }
entity_access_db_utils = { path = "../entity_access_db_utils" }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
bot_id = { path = "../bot_id" }
harness_id = { path = "../harness_id" }
channel_sender = { path = "../channel_sender" }
chrono = { workspace = true }
channels = { path = "../channels", features = ["ports"] }
lexical_client = { path = "../lexical_client" }
dashmap = { workspace = true }
futures = { workspace = true }
kafka_util = { path = "../kafka_util" }
conation_env_var = { path = "../conation_env_var" }
pipedream_mcp = { path = "../pipedream_mcp" }
conation_event_broker = { path = "../conation_event_broker", features = ["outbound"] }
conation_authorization = { path = "../conation_authorization", features = ["axum"] }
conation_tower_layers = { path = "../conation_tower_layers" }
conation_user_id = { path = "../conation_user_id" }
conation_uuid = { path = "../conation_uuid" }
model-entity = { path = "../model-entity" }
model_notifications = { path = "../model_notifications" }
notification = { path = "../notification" }
opentelemetry = { workspace = true, features = ["trace"] }
reqwest = { workspace = true }
redis = { workspace = true, features = ["aio", "tokio-comp"] }
rootcause = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
agent_fold = { path = "../agent_fold", features = ["test-utils"] }
agent_session = { path = "../agent_session", features = ["test-utils"] }
bot_id = { path = "../bot_id", features = ["test-utils"] }
harness_id = { path = "../harness_id", features = ["test-utils"] }
mockall = { workspace = true }
model_user = { path = "../model_user" }
