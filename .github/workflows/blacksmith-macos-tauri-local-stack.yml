# Fleet-owned. Not generated by `cargo x workflows` — do not overwrite.
#
# GitHub-hosted macos-15 (Apple Silicon). Personal repos like agisota/conation
# never get Blacksmith macOS runners; `runs-on: blacksmith-*` queues forever.
# Blacksmith alternative (org + GitHub App only):
#   runs-on: blacksmith-12vcpu-macos-15
#   or runs-on: blacksmith-6vcpu-macos-15
#   https://docs.blacksmith.sh/introduction/quickstart
#
# Builds an ad-hoc Conation .app + .dmg for THIS host's Tailscale operator.
# Must not bake conation.dev.
name: Blacksmith macOS local-stack Tauri
'on':
  workflow_dispatch:
    inputs:
      operator_origin:
        description: Operator origin (must not be conation.dev)
        required: false
        default: http://100.89.19.82:8090
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-github-hosted-local-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-macos:
    name: Tauri local-stack macOS
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CONATION_OPERATOR_ORIGIN: ${{ inputs.operator_origin || 'http://100.89.19.82:8090' }}
      CONATION_CLIENT_PROFILE: standalone
      CONATION_NATIVE_TARGET: local-stack
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: 'false'

      - name: Assert arm64 and refuse hosted origin
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Need Apple Silicon; got $(uname -m)" >&2
            exit 1
          fi
          origin="${CONATION_OPERATOR_ORIGIN:?CONATION_OPERATOR_ORIGIN is required}"
          case "$(printf '%s' "$origin" | tr '[:upper:]' '[:lower:]')" in
            *conation.dev*|same-origin|'')
              echo "CONATION_OPERATOR_ORIGIN must be this host's operator, not hosted conation.dev (got $origin)" >&2
              exit 1
              ;;
          esac
          echo "operator_origin=$origin"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown,aarch64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install just, wasm-pack, cargo-tauri
        run: |
          set -euo pipefail
          brew install just
          cargo install wasm-pack --locked
          cargo install tauri-cli --version 2.8.4 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo and bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/web/tauri/target
            ~/.bun/install/cache
          key: blacksmith-macos-tauri-${{ runner.os }}-${{ hashFiles('apps/web/tauri/Cargo.lock', 'bun.lock') }}
          restore-keys: blacksmith-macos-tauri-${{ runner.os }}-

      - name: Install JS workspace
        run: bun install --frozen-lockfile

      - name: Build local-stack Tauri desktop
        working-directory: apps/web
        run: just tauri-build-local-stack

      - name: Collect .app and .dmg
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > artifacts/NOTARIZATION.txt <<'EOF'
          Unsigned / ad-hoc signed Conation macOS build (APPLE_SIGNING_IDENTITY=-).
          Not notarized. Gatekeeper will block until you:
            xattr -cr Conation.app
          or System Settings → Privacy & Security → Open Anyway.
          Apple Developer ID and notarytool secrets were not used.
          Operator origin is this Linux host via Tailscale, not conation.dev.
          EOF
          printf 'CONATION_OPERATOR_ORIGIN=%s\n' "$CONATION_OPERATOR_ORIGIN" > artifacts/OPERATOR_ORIGIN.txt
          shopt -s nullglob
          found=0
          for dir in \
            apps/web/tauri/src-tauri/target/release/bundle \
            apps/web/tauri/target/release/bundle \
            apps/web/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle \
            apps/web/tauri/target/aarch64-apple-darwin/release/bundle
          do
            [ -d "$dir" ] || continue
            for dmg in "$dir"/dmg/*.dmg; do
              cp -v "$dmg" artifacts/
              found=1
            done
            for app in "$dir"/macos/*.app; do
              zipname="artifacts/$(basename "$app").zip"
              ditto -c -k --keepParent "$app" "$zipname"
              found=1
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "No .app/.dmg under Tauri bundle dirs" >&2
            find apps/web/tauri -name '*.dmg' -o -name '*.app' 2>/dev/null | head -50 >&2 || true
            exit 1
          fi
          (cd artifacts && shasum -a 256 -- * > SHA256SUMS)
          ls -la artifacts

      - name: Upload conation-macos-local-stack artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conation-macos-local-stack
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
