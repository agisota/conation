[package]
name = "navigation_plugin"
version = "0.1.0"
edition.workspace = true

[features]
# Intercept external URLs with the compiled CEF stub. Default off: system opener.
# Does not link Chromium.
cef = ["dep:cef_browser"]

[dependencies]
cef_browser = { path = "../cef_browser", optional = true }
rootcause = { workspace = true }
nom = "8"
logger = { path = "../logger" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_qs = "0.15"
tauri = { workspace = true }
tauri-plugin-opener = "2"
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
