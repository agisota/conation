<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Conation — рабочее пространство с искусственным интеллектом"
    />
    <meta name="macro-bundle-build" content="__MACRO_BUNDLE_BUILD__" />
    <link
      rel="shortcut icon"
      href="%ASSETS_PATH%/conation-favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%ASSETS_PATH%/conation-favicon.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="%ASSETS_PATH%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <noscript>Для работы Conation необходимо включить JavaScript.</noscript>
    <div id="root" class="h-[calc(var(--dvh,1dvh)*100)]"></div>
    <div id="modal" class="z-modal"></div>
    <!--
      Entrypoint
    -->
    <script type="module" src="/src/index.tsx"></script>
    <script>
      window.__START_TIME__ = performance.now();
    </script>
    <!-- Sets blank page to theme surface color to prevent background color flash -->
    <script>
      try {
        let htmlColorString = localStorage.getItem("html-color-theme");
        if (htmlColorString) {
          let htmlColor = JSON.parse(htmlColorString);
          document.body.style.backgroundColor = htmlColor.color;
        }
      } catch (err) {
        console.error("Failed parse conation-selected-theme: ", err);
      }
    </script>
  </body>
</html>
