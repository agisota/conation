<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Корпоративное рабочее пространство" />
    <meta name="macro-bundle-build" content="__MACRO_BUNDLE_BUILD__" />
    <link
      rel="shortcut icon"
      href="%ASSETS_PATH%/macro-favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%ASSETS_PATH%/macro-favicon.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="%ASSETS_PATH%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <!-- Match the saved appearance before the app bundle or the first paint. -->
    <script>
      try {
        const parse = (value) => {
          if (value === null) return null;
          try {
            return JSON.parse(value);
          } catch {
            return null;
          }
        };
        const keys = [
          "macro-theme-mode",
          "macro-theme-should-match-system",
          "macro-selected-theme",
          "macro-light-mode-theme",
          "macro-dark-mode-theme",
          "macro-user-themes",
          "html-color-theme",
        ];
        const savedMode = parse(localStorage.getItem("macro-theme-mode"));
        const legacyPinned =
          savedMode !== "light" &&
          savedMode !== "dark" &&
          savedMode !== "system" &&
          localStorage.getItem("macro-theme-should-match-system") === "false";
        const mode =
          savedMode === "light" ||
          savedMode === "dark" ||
          savedMode === "system"
            ? savedMode
            : legacyPinned
              ? "pinned"
              : keys.some((key) => localStorage.getItem(key) !== null)
                ? "system"
                : "light";
        const cached = parse(localStorage.getItem("html-color-theme"));
        const selected = parse(localStorage.getItem("macro-selected-theme"));
        const effective =
          mode === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode === "pinned"
              ? cached?.mode ?? (selected === "Macro Dark" ? "dark" : "light")
              : mode;
        const canUseCached =
          typeof cached?.color === "string" &&
          CSS.supports("color", cached.color) &&
          (legacyPinned || cached.mode === effective ||
            (cached.mode == null && mode !== "system"));
        const color = canUseCached
          ? cached.color
          : effective === "dark"
            ? "#000000"
            : "#ECE5DF";
        document.documentElement.dataset.themeLight =
          effective === "light" ? "true" : "false";
        document.body.style.backgroundColor = color;
      } catch {
        document.body.style.backgroundColor = "#ECE5DF";
      }
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="h-[calc(var(--dvh,1dvh)*100)]"></div>
    <div id="modal" class="z-modal"></div>
    <!--
      Entrypoint
    -->
    <script type="module" src="/src/index.tsx"></script>
    <script>
      window.__START_TIME__ = performance.now();
    </script>
  </body>
</html>
