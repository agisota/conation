[package]
name = "scheduled_action"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "service"
path = "src/bins/service.rs"

[[bin]]
name = "scheduled_action_openapi"
path = "src/bins/openapi.rs"

[[bin]]
name = "scheduled_action_doppler_config"
path = "src/doppler_config.rs"

[features]
default = []
local_auth = ["macro_authorization/local_auth"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
macro_env_var = { package = "conation_env_var", path = "../../crates/conation_env_var" }
macro_queues = { package = "conation_queues", path = "../../crates/conation_queues" }
macro_config = { package = "conation_config", path = "../../crates/conation_config" }
macro_authorization = { path = "../../crates/conation_authorization", features = [
  "postgres",
] }
database_env_vars = { path = "../../crates/database_env_vars" }
doppler-config = { workspace = true }
sqlx = { workspace = true }
macro_user_id = { package = "conation_user_id", path = "../../crates/conation_user_id"}
cron = { workspace = true }
anyhow = { workspace = true }
macro_uuid = { package = "conation_uuid", path = "../../crates/conation_uuid"}
chrono = { workspace = true}
chrono-tz = { workspace = true }
agent = { path = "../../crates/agent" }
ai_usage = { path = "../../crates/ai_usage" }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
ai_tools = { path = "../../crates/ai_tools" }
ai_toolset = { path = "../../crates/ai_toolset" }
aws-sdk-sqs = { workspace = true }
chat = { path = "../../crates/chat" }
connection_gateway_client = { path = "../../crates/connection_gateway_client" }
share_permission_db_utils = { path = "../../crates/share_permission_db_utils" }
models_permissions = { path = "../../crates/models_permissions" }
macro_db_client = { package = "conation_db_client", path = "../../crates/conation_db_client" }
memory = { path = "../../crates/memory" }
model = { path = "../../crates/model" }
model-entity = { path = "../../crates/model-entity" }
model_owner = { path = "../../crates/model_owner" }
entity_registry_db_utils = { path = "../../crates/entity_registry/entity_registry_db_utils" }
model_notifications = { path = "../../crates/model_notifications" }
notification = { path = "../../crates/notification" }
utoipa = { workspace = true, features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { workspace = true }
tower = { workspace = true }

macro_aws_config = { package = "conation_aws_config", path = "../../crates/conation_aws_config" }
macro_cors = { package = "conation_cors", path = "../../crates/conation_cors" }
macro_auth = { package = "conation_auth", path = "../../crates/conation_auth" }
macro_entrypoint = { path = "../../crates/conation_entrypoint" }
macro_env = { package = "conation_env", path = "../../crates/conation_env" }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
aws-sdk-secretsmanager = { workspace = true }

macro_service_urls = { package = "conation_service_urls", path = "../../crates/conation_service_urls" }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
macro_db_migrator = { package = "conation_db_migrator", path = "../../crates/conation_db_migrator" }
