[package]
edition = "2024"
name = "unfurl_service"
publish = false
version = "0.1.0"

[[bin]]
name = "unfurl_service"
path = "src/main.rs"

[[bin]]
name = "unfurl_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "unfurl_service_doppler_config"
path = "src/doppler_config.rs"

[features]
mock = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros"] }
doppler-config = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
conation_config = { path = "../../crates/conation_config" }
conation_cors = { path = "../../crates/conation_cors" }
conation_entrypoint = { path = "../../crates/conation_entrypoint" }
conation_env = { path = "../../crates/conation_env" }
reqwest = { workspace = true, features = ["stream"] }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
unfurl = { path = "../../crates/unfurl", features = ["axum", "outbound"] }
url = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
