[package]
edition = "2024"
name = "call_recording_preview_handler"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws_lambda_events = { workspace = true, features = ["s3"] }
lambda_runtime = { workspace = true }
conation_aws_config = { path = "../../crates/conation_aws_config", features = ["s3"] }
conation_entrypoint = { path = "../../crates/conation_entrypoint" }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "time"] }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
conation_env_var = { path = "../../crates/conation_env_var" }

[dev-dependencies]
conation_db_migrator = { path = "../../crates/conation_db_migrator" }
