[package]
edition = "2024"
name = "static_file_service"
publish = false
version = "0.1.0"

[[bin]]
name = "static_file_service"
path = "src/main.rs"

[[bin]]
name = "static_file_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "static_file_service_doppler_config"
path = "src/doppler_config.rs"

[features]
dynamodb_client_test = []
local_auth = ["macro_authorization/local_auth"]
tree_trace = []

[dependencies]
anyhow = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
aws-sdk-sqs.workspace = true
axum = { workspace = true, features = ["tower-log", "ws"] }
chrono = { workspace = true }
doppler-config = { workspace = true }
conation_auth = { path = "../../crates/conation_auth" }
macro_authorization = { path = "../../crates/conation_authorization" }
conation_aws_config = { path = "../../crates/conation_aws_config", features = ["s3"] }
conation_config = { path = "../../crates/conation_config" }
conation_cors = { path = "../../crates/conation_cors" }
conation_entrypoint = { package = "macro_entrypoint", path = "../../crates/conation_entrypoint" }
conation_env = { path = "../../crates/conation_env" }
conation_env_var = { path = "../../crates/conation_env_var" }
conation_queues = { path = "../../crates/conation_queues" }
model = { path = "../../crates/model" }
models_sfs = { path = "../../crates/models_sfs" }
s3_key = { path = "../../crates/s3_key" }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_dynamo = { workspace = true }
serde_json = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["limit", "timeout"] }
tracing.workspace = true
tracing-tree = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
uuid.workspace = true

conation_service_urls = { path = "../../crates/conation_service_urls" }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
