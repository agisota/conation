[package]
edition = "2024"
name = "image_proxy_service"
publish = false
version = "0.1.0"
default-run = "image_proxy_service"

[[bin]]
name = "image_proxy_service"
path = "src/main.rs"

[[bin]]
name = "image_proxy_service_openapi"
path = "src/openapi.rs"

[[bin]]
name = "image_proxy_service_doppler_config"
path = "src/doppler_config.rs"

[dependencies]
anyhow = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
axum = { workspace = true, features = ["macros"] }
doppler-config = { workspace = true }
conation_auth = { path = "../../crates/conation_auth" }
macro_authorization = { path = "../../crates/conation_authorization" }
conation_aws_config = { path = "../../crates/conation_aws_config" }
conation_config = { path = "../../crates/conation_config" }
conation_cors = { path = "../../crates/conation_cors" }
conation_entrypoint = { package = "macro_entrypoint", path = "../../crates/conation_entrypoint" }
conation_env = { path = "../../crates/conation_env" }
conation_middleware = { path = "../../crates/conation_middleware", default-features = false, features = [
  "tracking",
] }
model = { path = "../../crates/model" }
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
url = { workspace = true }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[dev-dependencies]
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
conation_auth = { path = "../../crates/conation_auth", features = ["testing"] }
